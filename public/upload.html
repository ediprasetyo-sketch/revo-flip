<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload Materi - Revo Flip</title><link rel="stylesheet" href="/styles.css"></head><body><header><a class="brand" href="/">REVO <span>FLIP</span></a><a class="button secondary" href="/">← Kembali</a></header><main class="upload-page"><section class="upload-panel"><p class="eyebrow">UPLOAD MATERI</p><h1>Tambahkan PDF baru</h1><p class="muted">Target V1: PDF hingga 10 GB dengan arsitektur multipart dan resumable upload.</p><label id="dropzone" class="dropzone"><input id="fileInput" type="file" accept="application/pdf"><strong>Drop PDF di sini</strong><span>atau klik untuk memilih file</span><small>Maksimum aplikasi: 10 GB</small></label><div id="fileInfo" hidden class="file-info"><div><strong id="fileName"></strong><span id="fileSize"></span></div><div class="progress"><i id="progressBar"></i></div><div class="upload-meta"><span id="progressText">Siap diunggah</span><span id="speedText">—</span></div><button id="startUpload" class="button">Mulai Upload</button></div><div id="status" class="status"></div></section></main><script src="/upload.js"></script></body></html>
