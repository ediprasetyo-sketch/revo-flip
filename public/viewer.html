<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revo Learning Flip</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/viewer-reference.css">
</head>
<body class="flip-page">
<header class="simple-header viewer-header">
  <a class="logo" href="/" aria-label="Kembali ke Revo Learning Flip">
    <span class="brand-mark">▮▮</span><span>Revo Learning Flip</span>
  </a>
</header>
<main class="flip-main">
  <section id="bookStage" class="flip-stage" aria-live="polite">
    <div class="flipbook-viewport"><div id="flipbook" class="flipbook"></div></div>
    <div class="flip-loading" id="loadingOverlay">
      <div class="loading-card">
        <div class="loading-spinner" aria-hidden="true"></div>
        <strong id="loadingMessage">Membuka buku...</strong>
        <span id="loadingSubtext">Menyiapkan halaman... 0%</span>
        <div class="loading-progress-track"><div id="loadingProgressBar" class="loading-progress-bar"></div></div>
      </div>
    </div>
  </section>
  <div class="flip-controls">
    <button id="prev" class="nav-button" aria-label="Halaman sebelumnya">‹</button>
    <span id="pageLabel">– / –</span>
    <button id="next" class="nav-button" aria-label="Halaman berikutnya">›</button>
    <i></i>
    <button id="share" class="share-button">↗ <span>Bagikan</span></button>
    <button id="delete" class="delete-button" hidden>🗑 <span>Hapus</span></button>
  </div>
</main>
<div id="orientationOverlay" class="orientation-overlay" hidden>
  <div class="orientation-icon" aria-hidden="true">↻</div>
  <h2>Putar Layar HP Anda</h2>
  <p>Untuk pengalaman membaca terbaik,<br>silakan gunakan mode lanskap.</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
<script src="/viewer.js"></script>
</body>
</html>
