<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revo Learning Flip</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/viewer-reference.css">
</head>
<body class="flip-page">
<header class="simple-header">
  <a class="logo" href="/">
    <span class="brand-mark">▮▮</span><span>Revo Learning Flip</span>
  </a>
</header>
<main class="flip-main">
  <section id="bookStage" class="flip-stage">
    <div class="flipbook-viewport"><div id="flipbook" class="flipbook"></div></div>
    <div class="flip-loading">Memuat flipbook…</div>
  </section>
  <div class="flip-controls">
    <button id="prev" class="nav-button" aria-label="Halaman sebelumnya">‹</button>
    <span id="pageLabel">– / –</span>
    <button id="next" class="nav-button" aria-label="Halaman berikutnya">›</button>
    <i></i>
    <button id="share" class="share-button">↗ <span>Bagikan</span></button>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
<script src="/viewer.js"></script>
</body>
</html>
