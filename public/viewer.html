<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revo Learning Flip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=20260821-brand-v4">
<link rel="stylesheet" href="/viewer-reference.css?v=20260821-brand-v4">
</head>
<body class="flip-page">
<header class="simple-header viewer-header">
  <a class="logo" href="/" aria-label="Kembali ke Revo Learning Flip">
    <span class="brand-mark" aria-hidden="true"><i class="fas fa-book-open"></i></span><span>Revo Learning Flip</span>
  </a>
</header>
<main class="flip-main">
  <section id="bookStage" class="flip-stage" aria-live="polite">
    <div class="flipbook-viewport"><div id="flipbook" class="flipbook"></div></div>
    <div class="flip-loading" id="loadingOverlay">
      <div class="loading-card">
        <div class="loading-spinner" aria-hidden="true"></div>
        <strong id="loadingMessage">Membuka buku...</strong>
        <span id="loadingSubtext">Menyiapkan halaman... 0%</span>
        <div class="loading-progress-track"><div id="loadingProgressBar" class="loading-progress-bar"></div></div>
      </div>
    </div>
  </section>
  <div class="flip-controls">
    <button id="prev" class="nav-button" aria-label="Halaman sebelumnya">‹</button>
    <span id="pageLabel">– / –</span>
    <button id="next" class="nav-button" aria-label="Halaman berikutnya">›</button>
    <i></i>
    <button id="share" class="share-button">↗ <span>Bagikan</span></button>
    <button id="delete" class="delete-button" hidden>🗑 <span>Hapus</span></button>
  </div>
</main>
<footer class="simple-footer viewer-footer">
  <span class="footer-mark" aria-hidden="true"><i class="fas fa-book-open"></i></span>
  <span>© 2026 Revo Learning Flip. All rights reserved.</span>
</footer>
<div id="orientationOverlay" class="orientation-overlay" hidden>
  <div class="orientation-icon" aria-hidden="true">↻</div>
  <h2>Putar Layar HP Anda</h2>
  <p>Untuk pengalaman membaca terbaik,<br>silakan gunakan mode lanskap.</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
<script src="/viewer.js?v=20260821-nav-v2"></script>
<script src="/navigation-fix.js?v=20260821-spread-v3"></script>
</body>
</html>
