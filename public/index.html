<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Revo Learning Flip</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/home-reference.css">
</head>
<body class="simple-home">
  <header class="simple-header">
    <a class="logo" href="/">
      <span class="brand-mark" aria-hidden="true">▮▮</span>
      <span>Revo Learning Flip</span>
    </a>
  </header>

  <main class="simple-home-main">
    <section class="upload-hero" id="uploadHero">
      <h1>Welcome Revo<br>Learning Flip</h1>
      <button id="pickPdf" class="upload-main-button" type="button"><span class="upload-icon">⇧</span><span>Upload File PDF</span></button>
      <p class="upload-limit">Maksimal ukuran file: 50MB</p>
      <input id="fileInput" type="file" accept="application/pdf,.pdf" hidden>
      <div id="quickUpload" class="quick-upload" hidden aria-live="polite">
        <div class="quick-file"><strong id="fileName"></strong><span id="fileSize"></span></div>
        <div class="progress"><i id="progressBar"></i></div>
        <div class="upload-meta"><span id="progressText">Menyiapkan upload…</span><span id="speedText">—</span></div>
        <div id="status" class="status"></div>
      </div>
    </section>
  </main>

  <footer class="simple-footer">
    <span class="footer-mark" aria-hidden="true">▮▮</span>
    <span>© 2026 Revo Learning Flip. All rights reserved.</span>
  </footer>
  <script src="/home.js"></script>
</body>
</html>
